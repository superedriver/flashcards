# Render Blueprint for Flashcards API (MVP).
# Secrets are stored in Render, never committed to Git.

services:
  - type: web
    name: flashcards-api
    runtime: node
    plan: free
    rootDir: .

    buildCommand: >
      pnpm install --frozen-lockfile &&
      pnpm --filter @flashcards/api db:generate &&
      pnpm --filter @flashcards/api build

    startCommand: >
      pnpm --filter @flashcards/api db:migrate:deploy &&
      pnpm --filter @flashcards/api start:prod

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Supabase Session Pooler connection string
      - key: DATABASE_URL
        sync: false

      # URL майбутнього production web
      - key: APP_WEB_URL
        sync: false

      # Allowed browser origin
      - key: CORS_ORIGIN
        sync: false

      # Render generates these secrets once
      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: INTERNAL_JOB_SECRET
        generateValue: true
