query MyDecks {
  myDecks {
    id
    ownerId
    title
    description
    visibility
    moderationStatus
    isOfficial
    sourceDeckId
    createdAt
    updatedAt
  }
}

query Deck($id: String!) {
  deck(id: $id) {
    id
    ownerId
    title
    description
    visibility
    moderationStatus
    isOfficial
    sourceDeckId
    createdAt
    updatedAt
  }
}

query DeckCards($deckId: String!) {
  deckCards(deckId: $deckId) {
    id
    deckId
    front
    back
    example
    notes
    position
    createdAt
    updatedAt
  }
}

mutation CreateDeck($input: CreateDeckInput!) {
  createDeck(input: $input) {
    deck {
      id
      ownerId
      title
      description
      visibility
      moderationStatus
      isOfficial
      sourceDeckId
      targetLanguage
      sourceLanguage
      createdAt
      updatedAt
    }
    warnings {
      code
      message
    }
  }
}

mutation UpdateDeck($input: UpdateDeckInput!) {
  updateDeck(input: $input) {
    deck {
      id
      ownerId
      title
      description
      visibility
      moderationStatus
      isOfficial
      sourceDeckId
      targetLanguage
      sourceLanguage
      createdAt
      updatedAt
    }
    warnings {
      code
      message
    }
  }
}

mutation DeleteDeck($deckId: String!) {
  deleteDeck(deckId: $deckId)
}

mutation CreateCard($input: CreateCardInput!) {
  createCard(input: $input) {
    id
    deckId
    front
    back
    example
    notes
    position
    createdAt
    updatedAt
  }
}

mutation UpdateCard($input: UpdateCardInput!) {
  updateCard(input: $input) {
    id
    deckId
    front
    back
    example
    notes
    position
    createdAt
    updatedAt
  }
}

mutation DeleteCard($cardId: String!) {
  deleteCard(cardId: $cardId)
}

mutation PublishDeck($deckId: String!) {
  publishDeck(deckId: $deckId) {
    id
    ownerId
    title
    description
    visibility
    moderationStatus
    isOfficial
    sourceDeckId
    createdAt
    updatedAt
  }
}

mutation UnpublishDeck($deckId: String!) {
  unpublishDeck(deckId: $deckId) {
    id
    ownerId
    title
    description
    visibility
    moderationStatus
    isOfficial
    sourceDeckId
    createdAt
    updatedAt
  }
}
