query AdminDashboardStats {
  adminDashboardStats {
    totalUsers
    totalDecks
    totalPublicDecks
    totalCards
    totalStudySessions
    totalReviews
    usersCreatedLast7Days
    decksCreatedLast7Days
    reviewsSubmittedLast7Days
  }
}

query AdminSearchUsers($input: AdminSearchUsersInput) {
  adminSearchUsers(input: $input) {
    items {
      id
      email
      role
      emailVerifiedAt
      blockedAt
      createdAt
      updatedAt
    }
    total
  }
}

mutation BlockUser($userId: ID!) {
  blockUser(userId: $userId) {
    id
    email
    role
    emailVerifiedAt
    blockedAt
    createdAt
    updatedAt
  }
}

mutation UnblockUser($userId: ID!) {
  unblockUser(userId: $userId) {
    id
    email
    role
    emailVerifiedAt
    blockedAt
    createdAt
    updatedAt
  }
}

query ModerationQueue($input: ModerationQueueInput) {
  moderationQueue(input: $input) {
    items {
      id
      ownerId
      ownerEmail
      title
      description
      visibility
      moderationStatus
      isOfficial
      sourceDeckId
      cardCount
      createdAt
      updatedAt
    }
    total
  }
}

