query ProfileMe {
  me {
    id
    email
    role
    emailVerifiedAt
    blockedAt
    createdAt
    updatedAt
  }
}

query ProfileAccount {
  myAccount {
    hasPassword
  }
}

mutation DeleteAccount {
  deleteAccount
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input)
}
