fragment LessonCardFields on LessonCard {
  cardId
  deckId
  front
  back
  example
  notes
  position
  learningStep
  learningGroup
  presentationMode
  reviewState {
    id
    learningStep
    longReviewSuccessCount
    dueAt
    lastReviewedAt
  }
}

mutation StartLesson($input: StartLessonInput!) {
  startLesson(input: $input) {
    sessionId
    deckId
    scope
    lessonSize
    totalCards
    cards {
      ...LessonCardFields
    }
  }
}

mutation StartHomeLesson($input: StartHomeLessonInput!) {
  startHomeLesson(input: $input) {
    sessionId
    deckId
    scope
    lessonSize
    totalCards
    cards {
      ...LessonCardFields
    }
  }
}

mutation SubmitReview($input: SubmitReviewInput!) {
  submitReview(input: $input) {
    sessionId
    cardId
    reviewedCards
    reviewState {
      id
      learningStep
      longReviewSuccessCount
      dueAt
      lastReviewedAt
    }
    nextCard {
      ...LessonCardFields
    }
  }
}

mutation CompleteLesson($input: CompleteLessonInput!) {
  completeLesson(input: $input) {
    sessionId
    deckId
    totalCards
    reviewedCards
    knownCount
    dontKnowCount
    completedAt
  }
}

mutation AbandonLesson($input: AbandonLessonInput!) {
  abandonLesson(input: $input) {
    success
  }
}

query DeckLearningStats($deckId: String!) {
  deckLearningStats(deckId: $deckId) {
    deckId
    totalCards
    toLearnCount
    practicedCount
    learnedCount
    dueCount
    nextDueAt
  }
}

query HomeLearningProgress {
  homeLearningProgress {
    activeTargetLanguage
    toLearnCount
    practicedCount
    learnedCount
    dueCount
    totalCardCount
  }
}
