query MySettings {
  myAccount {
    settings {
      userId
      interfaceLocale
      lessonSize
      notificationsEnabled
      reminderTime
      timezone
      nativeLanguage
      createdAt
      updatedAt
    }
  }
}

mutation UpdateMySettings($input: UpdateSettingsInput!) {
  updateSettings(input: $input) {
    userId
    interfaceLocale
    lessonSize
    notificationsEnabled
    reminderTime
    timezone
    nativeLanguage
    createdAt
    updatedAt
  }
}
