name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Validate Prisma schema
        run: pnpm --filter @flashcards/api db:validate

      - name: Generate Prisma client
        run: pnpm --filter @flashcards/api db:generate

      - name: Build API
        run: pnpm --filter @flashcards/api build

      - name: Typecheck mobile app
        run: pnpm --filter @flashcards/mobile typecheck
