name: Due Card Reminders

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-due-card-reminders:
    name: Trigger due card reminders
    runs-on: ubuntu-latest

    steps:
      - name: Call internal due-card reminder job
        env:
          DUE_CARD_REMINDER_JOB_URL: ${{ secrets.DUE_CARD_REMINDER_JOB_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
        run: |
          if [ -z "$DUE_CARD_REMINDER_JOB_URL" ] || [ -z "$INTERNAL_JOB_SECRET" ]; then
            echo "Missing required GitHub secrets: DUE_CARD_REMINDER_JOB_URL and INTERNAL_JOB_SECRET."
            exit 1
          fi

          curl -fsS -X POST "$DUE_CARD_REMINDER_JOB_URL" \
            -H "x-internal-job-secret: $INTERNAL_JOB_SECRET"
